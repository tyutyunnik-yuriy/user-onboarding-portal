services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://hr_app:hr_app_password@postgres:5432/hr_requests
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3002
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-publication}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    ports:
      - "3002:3002"
    command: sh -c "node scripts/wait-for-postgres.js && node scripts/apply-postgres-schema.js && node server.js"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_requests
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
